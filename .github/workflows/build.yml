name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build APK
        run: |
          yes | buildozer android debug --no-req-update
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tower-dominion-apk
          path: bin/*.apk
