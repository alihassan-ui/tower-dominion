name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install buildozer cython==0.29.36
          sudo apt-get update -qq
          sudo apt-get install -y -qq openjdk-17-jdk zip libtool automake autoconf pkg-config libffi-dev
      - name: Build APK
        run: |
          yes | buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tower-dominion-apk
          path: bin/*.apk
